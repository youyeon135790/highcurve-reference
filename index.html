<script>
const $ = (s, el=document) => el.querySelector(s); const $$ = (s, el=document) => [...el.querySelectorAll(s)];
window.imgRetry = (el) => { const n = Number(el.dataset.r || 0); if (n >= 2) { el.style.visibility = "hidden"; return; } el.dataset.r = n + 1; const src = el.getAttribute("src").split("?")[0]; setTimeout(() => { el.src = src + "?r=" + Date.now(); }, 800 * (n + 1)); };
const api = async (p, opt) => {
  opt = opt || {}; try { const t = localStorage.getItem("hc_token"); if (t) opt.headers = { ...(opt.headers || {}), Authorization: "Bearer " + t }; } catch (e) {}
  if (window.staticApi) return window.staticApi(p, opt);
  const j = await staticApi(p, opt);
  if (j && j.need_login) { if (typeof toast === "function") toast(j.error); location.hash = "#/login"; throw new Error(j.error); }
  if (j && j.error) throw new Error(j.error); return j; };
const post = (p, body, method="POST") => api(p, { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
const fmt = (n) => n == null ? "-" : n >= 1e8 ? (n/1e8).toFixed(1).replace(/\.0$/,"")+"억" : n >= 1e4 ? (n/1e4).toFixed(1).replace(/\.0$/,"")+"만" : n >= 1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,"")+"천" : String(n);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PLAT = { instagram: "Instagram", tiktok: "TikTok", youtube: "YouTube", meta_ad: "Meta 광고", web: "웹" };
const PLAT_ORDER = ["instagram", "youtube"];   // 화면에 보이는 플랫폼 (틱톡·메타광고는 데이터는 유지, 화면에서 숨김)

4 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" fill="#fff"/></g></svg>`,
  youtube: (s) => `<svg class="plogo" style="width:${s}px;height:${s}px" width="${s}" height="${s}" viewBox="0 0 24 24"><rect width="24" height="24" rx="6.5" fill="#ff0033"/><path d="M9.6 8.4v7.2l6-3.6z" fill="#fff"/></svg>`,
  meta_ad: (s) => `<svg class="plogo" style="width:${s}px;height:${s}px" width="${s}" height="${s}" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#fff"/><path d="M3.2 14.6c0-3.6 1.8-6.8 4.1-6.8 1.9 0 3 1.9 4.7 5 1.7-3.1 2.8-5 4.7-5 2.3 0 4.1 3.2 4.1 6.8 0 1.7-.7 2.6-1.9 2.6-1.4 0-2.2-1.5-3.6-4.2l-.9-1.8-.9 1.8c-1.4 2.7-2.2 4.2-3.6 4.2-1.4 0-2.2-1.5-3.6-4.2L5.5 11.2l-.4.8c-.8 1.7-1.2 2.6-1.9 2.6z" fill="none" stroke="#0866ff" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
  web: (s) => `<svg class="plogo" style="width:${s}px;height:${s}px" width="${s}" height="${s}" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#8a8f9e"/><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M6 12h12M12 6c2.5 2.5 2.5 9.5 0 12M12 6c-2.5 2.5-2.5 9.5 0 12" fill="none" stroke="#fff" stroke-width="1.3"/></svg>`,
};
const logo = (p, s=16) => (LOGO[p] || LOGO.web)(s);
let META = { industries: [], platforms: [], adapters: {}, config: {} }, state = { q: "", platform: "", industry: "", sort: "date", days: "100", source: "", kind: "", creator: "", paid: "", min_views: "", max_views: "", min_likes: "", max_likes: "", min_comments: "", max_comments: "" };
let filterOpen = false;
const KINDS = [["reel", "릴스"], ["shorts", "쇼츠"]];
function activeFilters() { return Object.entries(state).filter(([k, v]) => v && !["q", "sort"].includes(k)).length; }
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); };
function closeAll() { $("#drawer").classList.remove("open"); $("#modal").classList.remove("on"); $("#modal").classList.remove("rmodal"); $("#mask").classList.remove("on"); }

// ---------------- 카드
function card(it, opts={}) {
  const ratio = it.followers && it.views ? (it.views / it.followers).toFixed(1) + "x" : null;
  const short = (u) => { try { const x = new URL(u); return x.hostname.replace("www.", "") + x.pathname.replace(/\/$/, "").slice(0, 28); } catch { return u; } };
  return `<div class="card" data-id="${it.id}" onclick="openItem(${it.id})">
    <a class="thumb" href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="원본 열기">${it.thumbnail ? `<img src="${esc(it.thumbnail)}" loading="lazy" onerror="imgRetry(this)">` : `<div class="ph">썸네일 없음</div>`}
      <div class="badge">${logo(it.platform, 16)}${PLAT[it.platform] || it.platform}</div>
      <div class="cap">${esc((it.caption || "").split("\n")[0].slice(0, 60))}</div><span class="open">↗</span></a>
    <div class="body">
      <div class="acc">${esc(it.account_name || it.account || "-")}${it.account ? `<small>@${esc(it.account)}</small>` : ""}</div>
      <div class="meta"><span>${esc(it.posted_at || "")}</span>${it.platform === "meta_ad" ? `<span>${esc(it.ad_status || "")}</span><span><b>${it.ad_days ?? "-"}</b>일 게재</span>` :
        `<span>❤ <b>${fmt(it.likes)}</b></span><span>💬 <b>${fmt(it.comments)}</b></span><span>▶ <b>${fmt(it.views)}</b></span>${ratio ? `<span title="팔로워 대비 조회">⚡ <b>${ratio}</b></span>` : ""}`}</div>
      ${it.industry ? `<span class="ind">${esc(it.industry)}</span>` : ""}${it.kind && it.kind !== "reel" && it.kind !== "shorts" ? `<span class="ind">${({carousel:"캐러셀",image:"이미지",post:"게시물",ad:"광고"})[it.kind] || it.kind}</span>` : ""}${it.creator_type === "brand" ? `<span class="ind" style="background:#fff3e0;color:#a65a00">브랜드</span>` : ""}${it.paid ? `<span class="ind" style="background:#fde8e8;color:#b00">협찬</span>` : ""}
      <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${esc(short(it.url))}</a>
      <div class="act"><button onclick="event.stopPropagation();pickBoard(${it.id})">보드에 저장</button><a class="btn" style="flex:0;padding:6px 10px;font-size:12px" href="${esc(it.url)}" target="_blank" onclick="event.stopPropagation()">열기 ↗</a></div>
    </div></div>`;
}
function grid(items, emptyMsg) {
  if (!items.length) return `<div class="empty"><b>${emptyMsg || "아직 저장된 레퍼런스가 없어요"}</b>크롬 클리퍼로 보고 있는 릴스를 저장하거나, 설정에서 수집 어댑터를 연결하세요.<br>
    <button class="btn" onclick="demo()">샘플 데이터로 화면 보기</button><button class="btn" onclick="location.hash='#/settings'">설정으로</button></div>`;
  return `<div class="grid">${items.map(card).join("")}</div>`;
}

// ---------------- 탐색
async function viewExplore() {
  const qs = new URLSearchParams(Object.entries(state).filter(([k, v]) => v)).toString();
  const { items, total } = await api("/api/items?limit=120&" + qs);
  const chip = (k, v, label) => `<button class="chip ${state[k] === v ? "on" : ""}" onclick="setF('${k}','${v}')">${label}</button>`;
  $("#main").innerHTML = `
    <div class="top"><div class="search">🔍 <input id="q" placeholder="미니멀한 카페 인테리어, 사장님 훅, 20대 피부과…  (캡션·AI 설명·태그·계정 검색)" value="${esc(state.q)}"></div>
      <select class="chip" onchange="setF('sort',this.value)">${[["date","최신순"],["views","조회수순"],["ratio","팔로워 대비"],["likes","좋아요순"],["added","저장순"]].map(([v,l])=>`<option value="${v}" ${state.sort===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="chips">${chip("platform","","전체")}${PLAT_ORDER.map(p => chip("platform", p, logo(p, 16) + PLAT[p])).join("")}
      ${KINDS.map(([v, l]) => chip("kind", v, l)).join("")}
      <button class="chip ${filterOpen ? "on" : ""}" onclick="filterOpen=!filterOpen;viewExplore()">⚙ 필터 ${activeFilters() ? `<b>${activeFilters()}</b>` : ""}</button>
      ${activeFilters() ? `<button class="chip" onclick="resetFilters()">필터 초기화</button>` : ""}
      <span style="margin-left:auto;color:var(--mute);font-size:13px;align-self:center" title="설정 · 수집에서 변경">${total}건 · 수집기준 조회 ${fmt(META.config?.min_views)}↑ 좋아요 ${fmt(META.config?.min_likes)}↑</span></div>
    ${filterOpen ? `<div class="panel fpanel">
      <div class="frow"><label>게시 일시</label>${[["7","최근 7일"],["30","최근 30일"],["90","최근 90일"],["180","최근 6개월"],["365","최근 1년"]].map(([v,l]) => `<button class="chip ${state.days===v?"on":""}" onclick="state.days=state.days==='${v}'?'':'${v}';viewExplore()">${l}</button>`).join("")}</div>

      <div class="frow"><label>조회수</label><input class="fin" placeholder="이상 (예: 1만)" value="${esc(state.min_views)}" onchange="state.min_views=this.value;viewExplore()"><span>~</span><input class="fin" placeholder="이하" value="${esc(state.max_views)}" onchange="state.max_views=this.value;viewExplore()"></div>
      <div class="frow"><label>좋아요</label><input class="fin" placeholder="이상" value="${esc(state.min_likes)}" onchange="state.min_likes=this.value;viewExplore()"><span>~</span><input class="fin" placeholder="이하" value="${esc(state.max_likes)}" onchange="state.max_likes=this.value;viewExplore()"></div>

    </div>` : ""}
    ${state.q || activeFilters() ? `<h2>${state.q ? `"${esc(state.q)}" 검색 결과` : (state.platform ? logo(state.platform, 22) + " " + PLAT[state.platform] : "필터 결과")} <small>${total}건</small></h2>${grid(items)}`
      : (total ? await sections() + await platformSections() : grid([]))}`;

async function sections() {
  const hot = (await api("/api/items?sort=ratio&days=3&limit=6")).items;
  const top = (await api("/api/items?sort=views&days=30&limit=6")).items;
  if (!hot.length && !top.length) return "";
  return `${hot.length ? `<h2>팔로워 수 대비 인기 영상 <small>최근 3일 업로드 중 팔로워 대비 조회수가 높은 영상</small></h2><div class="grid">${hot.map(card).join("")}</div>` : ""}
          ${top.length ? `<h2>최근 30일 조회수 TOP</h2><div class="grid">${top.map(card).join("")}</div>` : ""}`;
}
async function platformSections() {
  let html = "";
  const secs = [["instagram", "Instagram 릴스", "인플루언서·크리에이터", "platform=instagram&kind=reel", () => { state.platform = "instagram"; }],
                ["youtube", "YouTube 쇼츠", "", "platform=youtube&kind=shorts", () => { state.platform = "youtube"; }]];
  for (const [p, title, sub, qs, setter] of secs) {
    const { items, total } = await api(`/api/items?${qs}&sort=views&limit=12`);
    if (!items.length && !["Instagram 릴스", "YouTube 쇼츠"].includes(title)) continue;
    window["_sec_" + secs.indexOf(secs.find(x => x[1] === title))] = setter;
    html += `<div class="psec">${logo(p, 26)}<h2>${title} <small>${total}건${sub ? " · " + sub : ""}</small></h2>${total > 12 ? `<button class="btn more" onclick="window['_sec_${secs.findIndex(x => x[1] === title)}']();viewExplore()">전체 보기 →</button>` : ""}</div>`;
    html += items.length ? `<div class="grid">${items.map(card).join("")}</div>` : `<div class="empty" style="padding:22px">아직 없어요 · 설정에서 수집하거나 클리퍼로 저장하세요</div>`;
  }
  return html;
}
function setF(k, v) { state[k] = v; viewExplore(); }
function resetFilters() { for (const k of Object.keys(state)) if (!["q", "sort"].includes(k)) state[k] = ""; viewExplore(); }

    <div class="body"><div class="acc">${esc(it.account_name || it.account || "-")}</div><div class="meta"><span>${esc(it.posted_at || "")}</span><span>▶ <b>${fmt(it.views)}</b></span><span>❤ <b>${fmt(it.likes)}</b></span>${it.followers ? `<span>👥 ${fmt(it.followers)}</span>` : ""}</div></div></div>`;
}
async function viewTrends() {
  const t = await api(`/api/trends2?days=${trendDays}&platform=${trendPlat}&industry=${encodeURIComponent(trendInd)}`);
  const max = Math.max(1, ...t.by_day.map(d => d.views));
  const sec = (title, sub, items, fn) => items.length ? `<h2>${title} <small>${sub}</small></h2><div class="grid">${items.map(fn).join("")}</div>` : "";
  $("#main").innerHTML = `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">트렌드</h2>
      <div class="tabs" style="margin:0 0 0 12px"><button class="${!trendPlat ? "on" : ""}" onclick="trendPlat='';viewTrends()">전체</button>${PLAT_ORDER.map(p => `<button class="${trendPlat === p ? "on" : ""}" onclick="trendPlat='${p}';viewTrends()">${logo(p, 14)} ${PLAT[p]}</button>`).join("")}</div>
      <div class="tabs" style="margin:0 0 0 12px">${[3, 7, 30].map(d => `<button class="${trendDays === d ? "on" : ""}" onclick="trendDays=${d};viewTrends()">최근 ${d}일</button>`).join("")}</div>
      <select class="chip" style="margin-left:auto" onchange="trendInd=this.value;viewTrends()"><option value="">업종 전체</option>${META.industries.map(i => `<option ${trendInd === i ? "selected" : ""}>${i}</option>`).join("")}</select></div>
    ${t.snapshot_days < 2 ? `<div class="panel" style="margin-bottom:12px;color:var(--mute);font-size:13px">📌 급상승은 매일 07:00 수치 스냅샷이 쌓여야 계산돼요. 지금은 첫날이라 내일부터 "어제 대비 얼마나 올랐는지"가 나옵니다.</div>` : ""}
    ${sec("🔥 급상승", `최근 ${trendDays}일 동안 조회수가 가장 많이 늘어난 콘텐츠`, t.rising, it => tcard(it, "+" + fmt(it.delta) + " (" + it.growth + "%)"))}
    ${sec("⚡ 골든", "팔로워·구독자 대비 조회수 배수가 높은 것 = 작은 계정이 터진 콘텐츠 힘", t.golden, it => tcard(it, (it.views / it.followers).toFixed(1) + "x"))}
    ${sec("🏆 이 기간 조회수 TOP", `최근 ${trendDays}일 업로드 기준`, t.new_top, it => tcard(it))}

const TOOL_ROUTES = new Set(["boards", "plan", "edit", "settings", "pricing", "admin"]);
async function ensureMe() { for (let i = 0; i < 40 && !window.loadMe; i++) await new Promise(r => setTimeout(r, 50)); if (!window.__meLoaded && window.loadMe) { await loadMe(); window.__meLoaded = true; } return window.authState ? window.authState() : null; }
async function route() {
  let h = location.hash.replace(/^#\/?/, "") || "reels"; let parts = h.split("/"); let [r, arg] = parts;
  const me = await ensureMe();
  document.body.classList.toggle("guest", !me); document.body.classList.toggle("admin", !!me && me.role === "admin"); document.body.classList.toggle("member", !!me && me.role !== "admin");
  if (!me) { if (r === "login") { curRoute = r; viewLogin(arg); return; } if (r !== "landing") { history.replaceState(null, "", "#/landing"); } curRoute = "landing"; return viewLanding(); }
  if (r === "landing" || r === "login") { location.replace("#/reels"); return; }
  if (me.role !== "admin" && TOOL_ROUTES.has(r)) { toast("기획 도구는 별도 상품이에요. 준비되면 열립니다"); location.replace("#/reels"); return; }
  curRoute = r;
  if (r === "reels") { R.plat = parts[1] || R.plat || "instagram"; R.cat = parts[2] ? decodeURIComponent(parts[2]) : ""; R.page = 0; if (R.plat === "youtube" && R.sort === "date") R.sort = "views"; }
  $$(".nav a[data-r]").forEach(a => a.classList.toggle("on", a.dataset.r === r)); renderCatNav();
  try {
    if (r === "explore") await viewExplore(); else if (r === "brands") await viewBrands(arg ? decodeURIComponent(arg) : null); else if (r === "trends") await viewTrends();
    else if (r === "reels") await viewReels(); else if (r === "boards") await viewBoards(arg); else if (r === "settings") await viewSettings(); else if (r === "plan") await viewPlan(arg); else if (r === "edit") viewEdit(); else if (r === "login") viewLogin(arg); else if (r === "account") await viewAccount(); else if (r === "support") await viewSupport(); else if (r === "pricing") await viewPricing(); else if (r === "admin") await viewAdmin(); else await viewExplore();
    const s = await api("/api/stats"); $("#count").textContent = `레퍼런스 ${s.items} · 브랜드 ${s.brands} · 보드 ${s.boards}`;
  } catch (e) { $("#main").innerHTML = `<div class="empty"><b>서버 연결 실패</b>${esc(e.message)}<br>터미널에서 <code>python3 server.py</code> 를 실행하세요.</div>`; }
}
window.addEventListener("hashchange", () => { document.body.classList.remove("nav-open"); route(); });
(async () => {

  try { META = await api("/api/meta"); } catch (e) {} renderCatNav(); route(); })();
</script>
