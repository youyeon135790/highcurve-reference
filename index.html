const logo = (p, s=16) => (LOGO[p] || LOGO.web)(s);
let META = { industries: [], platforms: [], adapters: {}, config: {} }, state = { q: "", platform: "", industry: "", sort: "date", days: "", source: "", kind: "", creator: "", paid: "", min_views: "", max_views: "", min_likes: "", max_likes: "", min_comments: "", max_comments: "" };

// ---------------- 카드
function card(it, opts={}) {
  const ratio = it.followers && it.views ? (it.views / it.followers).toFixed(1) + "x" : null;
  const short = (u) => { try { const x = new URL(u); return x.hostname.replace("www.", "") + x.pathname.replace(/\/$/, "").slice(0, 28); } catch { return u; } };
  return `<div class="card" data-id="${it.id}" onclick="openItem(${it.id})">
    <a class="thumb" href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="원본 열기">${it.thumbnail ? `<img src="${esc(it.thumbnail)}" loading="lazy" onerror="this.remove()">` : `<div class="ph">썸네일 없음</div>`}
      <div class="badge">${logo(it.platform, 16)}${PLAT[it.platform] || it.platform}</div>
      <div class="cap">${esc((it.caption || "").split("\n")[0].slice(0, 60))}</div><span class="open">↗</span></a>
    <div class="body">
      <div class="acc">${esc(it.account_name || it.account || "-")}${it.account ? `<small>@${esc(it.account)}</small>` : ""}</div>
      <div class="meta"><span>${esc(it.posted_at || "")}</span>${it.platform === "meta_ad" ? `<span>${esc(it.ad_status || "")}</span><span><b>${it.ad_days ?? "-"}</b>일 게재</span>` :
        `<span>❤ <b>${fmt(it.likes)}</b></span><span>💬 <b>${fmt(it.comments)}</b></span><span>▶ <b>${fmt(it.views)}</b></span>${ratio ? `<span title="팔로워 대비 조회">⚡ <b>${ratio}</b></span>` : ""}`}</div>
      ${it.industry ? `<span class="ind">${esc(it.industry)}</span>` : ""}${it.kind && it.kind !== "reel" && it.kind !== "shorts" ? `<span class="ind">${({carousel:"캐러셀",image:"이미지",post:"게시물",ad:"광고"})[it.kind] || it.kind}</span>` : ""}${it.creator_type === "brand" ? `<span class="ind" style="background:#fff3e0;color:#a65a00">브랜드</span>` : ""}${it.paid ? `<span class="ind" style="background:#fde8e8;color:#b00">협찬</span>` : ""}
      <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${esc(short(it.url))}</a>
      <div class="act"><button onclick="event.stopPropagation();pickBoard(${it.id})">보드에 저장</button><a class="btn" style="flex:0;padding:6px 10px;font-size:12px" href="${esc(it.url)}" target="_blank" onclick="event.stopPropagation()">열기 ↗</a></div>
    </div></div>`;
}
function grid(items, emptyMsg) {
  if (!items.length) return `<div class="empty"><b>${emptyMsg || "아직 저장된 레퍼런스가 없어요"}</b>크롬 클리퍼로 보고 있는 릴스를 저장하거나, 설정에서 수집 어댑터를 연결하세요.<br>
    <button class="btn" onclick="demo()">샘플 데이터로 화면 보기</button><button class="btn" onclick="location.hash='#/settings'">설정으로</button></div>`;
  return `<div class="grid">${items.map(card).join("")}</div>`;
}

async function viewExplore() {
  const qs = new URLSearchParams(Object.entries(state).filter(([k, v]) => v)).toString();
  const { items, total } = await api("/api/items?limit=120&" + qs);
  const chip = (k, v, label) => `<button class="chip ${state[k] === v ? "on" : ""}" onclick="setF('${k}','${v}')">${label}</button>`;
  $("#main").innerHTML = `

      ${activeFilters() ? `<button class="chip" onclick="resetFilters()">필터 초기화</button>` : ""}
      <span style="margin-left:auto;color:var(--mute);font-size:13px;align-self:center" title="설정 · 수집에서 변경">${total}건 · 수집기준 조회 ${fmt(META.config?.min_views)}↑ 좋아요 ${fmt(META.config?.min_likes)}↑</span></div>
    ${filterOpen ? `<div class="panel fpanel">
      <div class="frow"><label>게시 일시</label>${[["7","최근 7일"],["30","최근 30일"],["90","최근 90일"],["180","최근 6개월"],["365","최근 1년"]].map(([v,l]) => `<button class="chip ${state.days===v?"on":""}" onclick="state.days=state.days==='${v}'?'':'${v}';viewExplore()">${l}</button>`).join("")}</div>
      <div class="frow"><label>미디어 유형</label>${KINDS.map(([v,l]) => `<button class="chip ${state.kind===v?"on":""}" onclick="state.kind=state.kind==='${v}'?'':'${v}';viewExplore()">${l}</button>`).join("")}</div>
      <div class="frow"><label>협찬/광고</label><button class="chip ${state.paid?"on":""}" onclick="state.paid=state.paid?'':'1';viewExplore()">협찬·유료 광고 표시만</button></div>
      <div class="frow"><label>조회수</label><input class="fin" placeholder="이상 (예: 1만)" value="${esc(state.min_views)}" onchange="state.min_views=this.value;viewExplore()"><span>~</span><input class="fin" placeholder="이하" value="${esc(state.max_views)}" onchange="state.max_views=this.value;viewExplore()"></div>
      <div class="frow"><label>좋아요</label><input class="fin" placeholder="이상" value="${esc(state.min_likes)}" onchange="state.min_likes=this.value;viewExplore()"><span>~</span><input class="fin" placeholder="이하" value="${esc(state.max_likes)}" onchange="state.max_likes=this.value;viewExplore()"></div>
      <div class="frow"><label>댓글</label><input class="fin" placeholder="이상" value="${esc(state.min_comments)}" onchange="state.min_comments=this.value;viewExplore()"><span>~</span><input class="fin" placeholder="이하" value="${esc(state.max_comments)}" onchange="state.max_comments=this.value;viewExplore()"></div>
      <div class="frow" style="align-items:flex-start"><label>업종 카테고리</label><div class="kw">${META.industries.map(i => `<button class="chip ${state.industry===i?"on":""}" onclick="state.industry=state.industry==='${i}'?'':'${i}';viewExplore()">${i}</button>`).join("")}</div></div>
    </div>` : ""}
    ${state.q || activeFilters() ? `<h2>${state.q ? `"${esc(state.q)}" 검색 결과` : (state.platform ? logo(state.platform, 22) + " " + PLAT[state.platform] : "필터 결과")} <small>${total}건</small></h2>${grid(items)}`
      : (total ? await sections() + await platformSections() : grid([]))}`;
  const q = $("#q"); q.addEventListener("keydown", e => { if (e.key === "Enter") { state.q = q.value.trim(); viewExplore(); } });

async function sections() {
  const hot = (await api("/api/items?sort=ratio&days=3&limit=6")).items;
  const top = (await api("/api/items?sort=views&days=30&limit=6")).items;
  if (!hot.length && !top.length) return "";
  return `${hot.length ? `<h2>팔로워 수 대비 인기 영상 <small>최근 3일 업로드 중 팔로워 대비 조회수가 높은 영상</small></h2><div class="grid">${hot.map(card).join("")}</div>` : ""}
          ${top.length ? `<h2>최근 30일 조회수 TOP</h2><div class="grid">${top.map(card).join("")}</div>` : ""}`;
}
async function platformSections() {
  let html = "";
  const secs = [["instagram", "Instagram 릴스", "인플루언서·크리에이터", "platform=instagram&kind=reel", () => { state.platform = "instagram"; }],
                ["youtube", "YouTube 쇼츠", "", "platform=youtube&kind=shorts", () => { state.platform = "youtube"; }]];
  for (const [p, title, sub, qs, setter] of secs) {
    const { items, total } = await api(`/api/items?${qs}&sort=views&limit=12`);
    if (!items.length && !["Instagram 릴스", "YouTube 쇼츠"].includes(title)) continue;
    window["_sec_" + secs.indexOf(secs.find(x => x[1] === title))] = setter;
    html += `<div class="psec">${logo(p, 26)}<h2>${title} <small>${total}건${sub ? " · " + sub : ""}</small></h2>${total > 12 ? `<button class="btn more" onclick="window['_sec_${secs.findIndex(x => x[1] === title)}']();viewExplore()">전체 보기 →</button>` : ""}</div>`;
    html += items.length ? `<div class="grid">${items.map(card).join("")}</div>` : `<div class="empty" style="padding:22px">아직 없어요 · 설정에서 수집하거나 클리퍼로 저장하세요</div>`;
  }
  return html;
}
function setF(k, v) { state[k] = v; viewExplore(); }
function resetFilters() { for (const k of Object.keys(state)) if (!["q", "sort"].includes(k)) state[k] = ""; viewExplore(); }

let trendInd = "", trendDays = 7, trendPlat = "";
function tcard(it, extra) {

    <div class="body"><div class="acc">${esc(it.account_name || it.account || "-")}</div><div class="meta"><span>${esc(it.posted_at || "")}</span><span>▶ <b>${fmt(it.views)}</b></span><span>❤ <b>${fmt(it.likes)}</b></span>${it.followers ? `<span>👥 ${fmt(it.followers)}</span>` : ""}</div></div></div>`;
}
async function viewTrends() {
  const t = await api(`/api/trends2?days=${trendDays}&platform=${trendPlat}&industry=${encodeURIComponent(trendInd)}`);
  const max = Math.max(1, ...t.by_day.map(d => d.views));
  const sec = (title, sub, items, fn) => items.length ? `<h2>${title} <small>${sub}</small></h2><div class="grid">${items.map(fn).join("")}</div>` : "";
  $("#main").innerHTML = `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">트렌드</h2>
      <div class="tabs" style="margin:0 0 0 12px"><button class="${!trendPlat ? "on" : ""}" onclick="trendPlat='';viewTrends()">전체</button>${PLAT_ORDER.map(p => `<button class="${trendPlat === p ? "on" : ""}" onclick="trendPlat='${p}';viewTrends()">${logo(p, 14)} ${PLAT[p]}</button>`).join("")}</div>
      <div class="tabs" style="margin:0 0 0 12px">${[3, 7, 30].map(d => `<button class="${trendDays === d ? "on" : ""}" onclick="trendDays=${d};viewTrends()">최근 ${d}일</button>`).join("")}</div>
      <select class="chip" style="margin-left:auto" onchange="trendInd=this.value;viewTrends()"><option value="">업종 전체</option>${META.industries.map(i => `<option ${trendInd === i ? "selected" : ""}>${i}</option>`).join("")}</select></div>
    ${t.snapshot_days < 2 ? `<div class="panel" style="margin-bottom:12px;color:var(--mute);font-size:13px">📌 급상승은 매일 07:00 수치 스냅샷이 쌓여야 계산돼요. 지금은 첫날이라 내일부터 "어제 대비 얼마나 올랐는지"가 나옵니다.</div>` : ""}
    ${sec("🔥 급상승", `최근 ${trendDays}일 동안 조회수가 가장 많이 늘어난 콘텐츠`, t.rising, it => tcard(it, "+" + fmt(it.delta) + " (" + it.growth + "%)"))}
    ${sec("⚡ 골든", "팔로워·구독자 대비 조회수 배수가 높은 것 = 작은 계정이 터진 콘텐츠 힘", t.golden, it => tcard(it, (it.views / it.followers).toFixed(1) + "x"))}

    ${R.q && !yt ? `<div id="raccts"></div>` : ""}

async function liveSearch() {
  const b = $("#rlive"), m = $("#rlivemsg"); if (!b || b.disabled) return; b.disabled = true; m.textContent = "인스타에서 긁어오는 중… (10~40초)";

    m.textContent = `검색 릴스 ${r.fetched}개 중 신규 ${r.created}개 + 계정 릴스 ${r.reels_new}개 저장 · 크레딧 ${r.credits ?? "-"}`;

      <div class="panel"><b>4. 인스타 공식 API</b> ${st(a.instagram_graph)}<p style="color:var(--mute);font-size:13px">무료·합법. 우리 계정은 조회수·도달·저장·공유까지, 남의 공개 비즈니스 계정은 좋아요·댓글·날짜·캡션(조회수 제외). 브랜드 아카이브의 인스타 계정을 매일 갱신하는 데 씁니다. <code>META_ACCESS_TOKEN</code> <code>IG_USER_ID</code></p>
        <button class="btn p" ${a.instagram_graph ? "" : "disabled"} onclick="sync('instagram_graph',{mode:'own'})">우리 계정 게시물 + 인사이트 수집</button></div>
      <div class="panel"><b>5. 데이터 벤더 (Apify) — 유료, 선택</b> ${st(a.apify)}<p style="color:var(--mute);font-size:13px">남의 공개 계정 릴스의 조회수·좋아요·댓글·날짜. 긁는 건 벤더가 합니다. <code>APIFY_TOKEN</code></p>
        <div class="row"><input id="ap_h" placeholder="계정 여러 개 쉼표 구분, 또는 #해시태그" style="border:1px solid var(--line);border-radius:8px;padding:8px;flex:1"><select id="ap_ind" class="chip"><option value="">업종</option>${META.industries.map(i => `<option>${i}</option>`).join("")}</select><button class="btn p" ${a.apify ? "" : "disabled"} onclick="apifyRun()">수집</button></div>

        <button class="btn p" ${a.ai_describe ? "" : "disabled"} onclick="sync('ai_describe',{all_missing:true})">설명 없는 항목 50개 처리</button></div>
      <div class="panel"><b>데이터</b><p style="color:var(--mute);font-size:13px">DB: <code>data/hub.db</code> (SQLite 파일 하나). 백업은 이 파일만 복사하면 됩니다.</p>
        <div class="row"><a class="btn" href="/api/export.csv" download>CSV 내보내기</a><button class="btn" onclick="demo()">샘플 데이터 넣기</button><button class="btn d" onclick="post('/api/demo/clear').then(()=>{toast('샘플 삭제');route()})">샘플 지우기</button></div></div>
    </div>
    <h2>수집 기준 <small>이 기준 아래는 수집 자체를 안 해요 (메타 광고는 조회수가 없어 제외)</small></h2>
    <div class="panel"><div class="row">
      <div><label style="font-size:12px;color:var(--mute)">최소 조회수</label><br><input id="c_views" value="${META.config.min_views}" style="border:1px solid var(--line);border-radius:8px;padding:8px;width:120px"></div>
      <div><label style="font-size:12px;color:var(--mute)">최소 좋아요</label><br><input id="c_likes" value="${META.config.min_likes}" style="border:1px solid var(--line);border-radius:8px;padding:8px;width:120px"></div>

      <div><label style="font-size:12px;color:var(--mute)">최소 팔로워 대비 배수</label><br><input id="c_ratio" value="${META.config.min_ratio}" style="border:1px solid var(--line);border-radius:8px;padding:8px;width:120px"></div>
      <div><label style="font-size:12px;color:var(--mute)">인스타 최소 조회수</label><br><input id="c_igv" value="${META.config.ig_min_views ?? 50000}" style="border:1px solid var(--line);border-radius:8px;padding:8px;width:120px"></div>
      <div><label style="font-size:12px;color:var(--mute)">인스타 조회수 없을 때 최소 좋아요</label><br><input id="c_igl" value="${META.config.ig_min_likes_no_views ?? 1000}" style="border:1px solid var(--line);border-radius:8px;padding:8px;width:120px"></div>
      <div><label style="font-size:12px;color:var(--mute)">계정당 최대 노출</label><br><input id="c_cap" value="${META.config.max_per_account ?? 5}" style="border:1px solid var(--line);border-radius:8px;padding:8px;width:100px"></div>
      <label style="font-size:12px;align-self:flex-end;padding-bottom:10px"><input type="checkbox" id="c_clip" ${META.config.apply_to_clipper ? "checked" : ""}> 클리퍼로 직접 저장할 때도 적용</label>
      <button class="btn p" style="align-self:flex-end" onclick="saveConfig()">기준 저장</button>
      <button class="btn d" style="align-self:flex-end" onclick="purgeLow()">기준 미달 항목 지금 정리</button></div>
      <p style="color:var(--mute);font-size:12px;margin:10px 0 0">예: 조회수 1만·좋아요 100이면 "1만 미만이거나 좋아요 100 미만"은 안 들어와요. 반응률 2%면 좋아요가 조회수의 2% 이상인 것만. 팔로워 대비 3x면 구독자의 3배 이상 터진 영상만.</p></div>
    <h2>자동 최신화 · 안전 모드</h2><div class="panel" style="font-size:13px;line-height:1.8">
      <b>매일 07:00 자동 갱신</b> — 터미널에서 한 번: <code>YOUTUBE_API_KEY=… python3 sync_all.py --install</code> (브랜드 아카이브의 계정을 플랫폼별 공식 API로 다시 받아 조회수·좋아요를 갱신)<br>
      <b>공개 안전 모드</b> ${a.safe_mode ? '<span class="ok">● 켜짐</span>' : '<span class="no">○ 꺼짐</span>'} — <code>HUB_SAFE=1</code> 로 서버를 켜면 공식 API 출처가 아닌 썸네일(클리퍼·벤더)은 파일로 보관하지 않고 링크·수치·우리 메모만 남깁니다. 외부로 새어도 남의 이미지 파일이 없습니다.</div>
    <h2>키 넣는 법</h2><div class="panel" style="font-size:13px;line-height:1.8">터미널에서 서버를 켤 때 앞에 붙입니다. 한 번 넣어두려면 <code>~/.zshrc</code>에 같은 줄을 추가하세요.<br>
      <code>YOUTUBE_API_KEY=… META_ACCESS_TOKEN=… IG_USER_ID=… HUB_SAFE=1 python3 server.py</code><br>
      유튜브 키(무료, 5분): console.cloud.google.com → 새 프로젝트 → API 및 서비스 → 라이브러리에서 YouTube Data API v3 사용 → 사용자 인증 정보 → API 키 만들기.<br>메타 토큰(무료): developers.facebook.com → 앱 만들기 → Instagram Graph API 추가 → 그래프 API 탐색기에서 토큰 발급(instagram_basic, pages_read_engagement) → 장기 토큰으로 교환. IG_USER_ID 는 연결된 인스타 비즈니스 계정 ID.</div>`;
}
async function saveConfig() {
  META.config = await post("/api/config", { min_views: Number($("#c_views").value) || 0, min_likes: Number($("#c_likes").value) || 0, min_engagement: Number($("#c_eng").value) || 0, min_ratio: Number($("#c_ratio").value) || 0, apply_to_clipper: $("#c_clip").checked, max_per_account: Number($("#c_cap").value) || 0, ig_min_views: Number($("#c_igv").value) || 0, ig_min_likes_no_views: Number($("#c_igl").value) || 0 });
  toast("수집 기준 저장됨 — 다음 수집부터 적용");
}
async function purgeLow() { if (!confirm("현재 기준 미달인 레퍼런스를 삭제할까요? (클리퍼 저장분은 옵션에 따라)")) return; const r = await post("/api/purge_low"); toast(`${r.deleted}건 정리`); route(); }
async function sync(name, params) { toast("수집 중… (수십 초 걸릴 수 있어요)"); try { const r = await post("/api/sync/" + name, params); toast(`${r.count}건 저장 (신규 ${r.created ?? "-"}${r.skipped ? ", 기준 미달 제외 " + r.skipped : ""})`); route(); } catch (e) { toast("실패: " + e.message); } }
function ytRun() { const v = $('#yt_q').value.trim(); if (!v) return; sync('youtube', v.startsWith('@') ? { handle: v, industry: $('#yt_ind').value } : { q: v, days: 90, industry: $('#yt_ind').value }); }
function apifyRun() { const v = $("#ap_h").value.trim(); if (!v) return; const p = v.startsWith("#") ? { hashtag: v } : { handles: v.split(",").map(s => s.trim()).filter(Boolean) }; p.industry = $("#ap_ind").value; sync("apify", p); }
async function syncAllBrands() { const brands = await api("/api/brands"); for (const b of brands.filter(b => b.platform === "instagram")) await sync("apify", { handles: [b.handle], industry: b.industry }); }
async function demo() { await post("/api/demo"); toast("샘플 24건 추가 (설정에서 지울 수 있어요)"); route(); }

// ---------------- 도구 페이지
// ---------------- ✍️ 기획 (레퍼런스 4~5개 → 분석 → 하이커브 양식 기획안)
const PLANREFS = () => { try { return JSON.parse(localStorage.getItem("planRefs") || "[]"); } catch (e) { return []; } };
const setPlanRefs = (a) => { localStorage.setItem("planRefs", JSON.stringify([...new Set(a)].slice(0, 6))); updatePlanBadge(); };
function togglePlanRef(id) { const a = PLANREFS(); const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); setPlanRefs(a); toast(i >= 0 ? "기획 바구니에서 뺐어요" : `기획 바구니에 담았어요 (${PLANREFS().length}개)`); const b = $("#planbtn-" + id); if (b) b.textContent = i >= 0 ? "✍️ 기획에 담기" : "✅ 담김"; }
function updatePlanBadge() { const n = PLANREFS().length; const a = $('a[data-r="plan"]'); if (a) a.innerHTML = `✍️ 기획 ${n ? `<span class="tag" style="background:#111;color:#fff">${n}</span>` : ""}`; }
let PLAN = { current: null };
async function viewPlan(arg) {
  updatePlanBadge();
  if (arg === "new") return viewPlanWizard();
  if (arg) return viewPlanWizard(arg);
  return viewPlanHome();
}
async function exportBoardPrompt() {
  const boards = await api("/api/boards"); if (!boards.length) return toast("보드가 없어요");
  const name = prompt("어느 보드? " + boards.map(b => b.name).join(" / "), boards[0].name); const b = boards.find(x => x.name === name); if (!b) return;
  const { items } = await api("/api/items?limit=200&board=" + b.id);
  const txt = `# 레퍼런스 보드: ${b.name} (${items.length}개)\n` + items.map(i => `- [${PLAT[i.platform]}] @${i.account || "-"} (${i.posted_at || ""}) 조회 ${fmt(i.views)} · 좋아요 ${fmt(i.likes)} · 팔로워 ${fmt(i.followers)}\n  훅: ${(i.caption || "").split("\n")[0].slice(0, 80)}\n  ${i.description ? "설명: " + i.description + "\n  " : ""}${i.note ? "메모: " + i.note : ""}`).join("\n");
  await navigator.clipboard.writeText(txt); toast("클립보드에 복사됨 — 클로드 코드에 붙여넣으세요");
}
function viewEdit() { $("#main").innerHTML = `<h2 style="margin:0 0 4px">🎬 편집</h2><div class="muted" style="margin-bottom:14px">기획안이 나온 뒤 촬영 → 편집 → 납품까지의 하이커브 편집 흐름과 규칙. 편집자에게 그대로 전달하는 기준입니다.</div>
  <div class="two">
  <div class="panel"><b>① 편집 파이프라인</b><ol style="margin:8px 0 0 18px;line-height:1.8"><li><b>기획안</b> — ✍️ 기획에서 씬표·훅·자막 확정 (JSON/엑셀 내보내기)</li><li><b>촬영</b> — 촬영 지시서대로 컷·인서트 확보 (씬당 2테이크 이상)</li><li><b>캡컷 자동자막</b> — 원본 붙여 자동 자막 생성 후 오탈자만 수정</li><li><b>러프컷(자동)</b> — 캡컷 러프컷 스킬: 무음·군더더기 컷 제거, 자막 스타일(꾹꾹체 등), 효과음 자동 배치</li><li><b>편집자 마무리 20분</b> — B롤·강조 자막·줌인·색보정</li><li><b>납품 체크</b> — 아래 체크리스트 통과 후 업로드</li></ol></div>
  <div class="panel"><b>② 납품 전 체크리스트</b><ul style="margin:8px 0 0 18px;line-height:1.8"><li>0~1초에 첫 자막이 뜨는가 (검은 화면·로고 인트로 금지)</li><li>훅 자막은 화면 상단 1/3, 12자 이내, 한 줄</li><li>컷 전환 3~5초 이내, 같은 구도 6초 이상 지속 금지</li><li>자막은 말과 동시에, 한 줄 10자·1.2초 리듬, 강조어는 색·크기로만</li><li>정보 씬마다 인서트(손·제품·화면녹화) 1개 이상</li><li>효과음: 훅·반전·CTA 3지점, BGM은 -18dB 이하</li><li>엔딩은 CTA 자막으로 끝내고 마지막 1초 검은 화면 없음</li><li>세이프존: 하단 20%(캡션·버튼 영역)에 자막 배치 금지</li></ul></div>
  </div>
  <div class="two" style="margin-top:12px">
  <div class="panel"><b>③ 캡컷 러프컷 스킬 (클로드 코드)</b><div class="muted" style="margin:6px 0">유연 표준 팩: Pretendard 번들 · 자막 프리셋 · 호흡 컷 기준. 클로드 코드에서 프로젝트 이름과 함께 부르면 됩니다.</div><code>0907 컷편집해줘</code> · <code>0907 꾹꾹체로 자막 넣어줘</code> · <code>0907 러프컷 돌리고 효과음도 넣어줘</code><div class="muted" style="margin-top:8px">다음 단계(준비중): 색보정·애니메이션 자동 → 프롬프터 → 대본 교정 → 강조 자막·B롤 자동 제안</div></div>
  <div class="panel"><b>④ 편집자에게 전달하기</b><div style="margin:6px 0">기획안 페이지의 <b>JSON 복사</b> 또는 <b>엑셀 다운로드</b> 결과를 그대로 편집자에게 전달합니다. 씬표의 '연출·편집' 열과 '이탈 방지' 열이 편집 지시서입니다.</div><div class="muted">하이커브 스튜디오 편집자 콜(건바이건 배분)과 연결되면 이 페이지에서 바로 발주가 됩니다 — 준비중</div><div style="margin-top:8px"><a class="btn" href="#/plan">✍️ 기획안 보관함으로</a></div></div>
  </div>`; }

// ---------------- 사이드바 카테고리 트리
let navOpen = { instagram: true, youtube: true };
function renderCatNav() {
  const on = (plat) => curRoute === "reels" && R.plat === plat ? "on" : "";
  $("#catnav").innerHTML = `<a class="${on("instagram")}" href="#/reels/instagram">${logo("instagram", 18)} 인스타그램 릴스</a><a class="${on("youtube")}" href="#/reels/youtube">${logo("youtube", 18)} 유튜브 쇼츠</a>`;
}
let curRoute = "reels";

// ---------------- 라우팅
async function route() {
  const h = location.hash.replace(/^#\/?/, "") || "reels"; const parts = h.split("/"); const [r, arg] = parts; curRoute = r;
  if (r === "reels") { R.plat = parts[1] || R.plat || "instagram"; R.cat = parts[2] ? decodeURIComponent(parts[2]) : ""; R.page = 0; if (R.plat === "youtube" && R.sort === "date") R.sort = "views"; }
  $$(".nav a[data-r]").forEach(a => a.classList.toggle("on", a.dataset.r === r)); renderCatNav();
  try {
    if (r === "explore") await viewExplore(); else if (r === "brands") await viewBrands(arg ? decodeURIComponent(arg) : null); else if (r === "trends") await viewTrends();
    else if (r === "reels") await viewReels(); else if (r === "boards") await viewBoards(arg); else if (r === "settings") await viewSettings(); else if (r === "plan") await viewPlan(arg); else if (r === "edit") viewEdit(); else await viewExplore();
    const s = await api("/api/stats"); $("#count").textContent = `레퍼런스 ${s.items} · 브랜드 ${s.brands} · 보드 ${s.boards}`;
  } catch (e) { $("#main").innerHTML = `<div class="empty"><b>서버 연결 실패</b>${esc(e.message)}<br>터미널에서 <code>python3 server.py</code> 를 실행하세요.</div>`; }
}
window.addEventListener("hashchange", route);
(async () => { try { META = await api("/api/meta"); } catch (e) {} renderCatNav(); route(); })();
</script>
